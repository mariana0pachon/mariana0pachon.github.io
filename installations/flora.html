  <body class="project">
    <div class="project-image has-slideshow" id="slideshow">

      <div

      ></div>
      <div

      ></div>
      <div

      ></div>
      <div

      ></div>
      <div

      <div

      ></div>
      <div

      ></div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/installations/flora/8.MP4" type="video/mp4" />

    <div class="project-content">
      <a class="project-back" href="../index.html">← back</a>
      <h1>flora</h1>
      <h5>
        Winner of the
        <a
          href="https://2025.amaze-berlin.de/award-winners/"
          target="_blank"
          rel="noopener noreferrer"
          >Amaze Fest 2025 Explorer Award</a
        >. Exhibited at the 2025 BCN Games Fest. Featured on the
        <a
          href="https://blog.arduino.cc/2024/10/18/technology-meets-creativity-in-two-interactive-art-student-projects/"
          target="_blank"
          rel="noopener noreferrer"
          >Arduino Blog</a
        >.
      </h5>
      <p>A short description of flora goes here.</p>
    </div>

    <script>
      const slides = document.querySelectorAll('.slideshow-slide');
      let current = 0;
      let timer = null;

      // Detect portrait videos: use contain instead of cover
      slides.forEach((slide) => {
        const video = slide.querySelector('video');
        if (!video) return;
        video.addEventListener('loadedmetadata', () => {
          if (video.videoHeight > video.videoWidth) {
            video.style.objectFit = 'contain';
          }
        });
      });

      // Detect portrait images: use contain + no-repeat so they don't tile
      slides.forEach((slide) => {
        const bg = slide.style.backgroundImage;
        if (!bg) return;
        const match = bg.match(/url\(['"]?([^'"]+)['"]?\)/);
        if (!match) return;
        const img = new Image();
        img.onload = () => {
          if (img.naturalHeight > img.naturalWidth) {
            slide.style.backgroundSize = 'contain';
            slide.style.backgroundRepeat = 'no-repeat';
          }
        };
        img.src = match[1];
      });

      function goToSlide(index) {
        clearTimeout(timer);

        const prevSlide = slides[current];
        const prevVideo = prevSlide.querySelector('video');
        if (prevVideo) {
          prevVideo.pause();
          prevVideo.currentTime = 0;
        }
        prevSlide.classList.remove('active');

        current = index % slides.length;
        const slide = slides[current];
        slide.classList.add('active');

        const video = slide.querySelector('video');
        if (video) {
          video.addEventListener('ended', () => goToSlide(current + 1), { once: true });
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              video.muted = true;
              video.play();
            });
          }
        } else {
          timer = setTimeout(() => goToSlide(current + 1), 3000);
        }
      }

      // Start: first slide is already active, check if it's a video
      const firstVideo = slides[0].querySelector('video');
      if (firstVideo) {
        firstVideo.addEventListener('ended', () => goToSlide(1), { once: true });
        const playPromise = firstVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            firstVideo.muted = true;
            firstVideo.play();
          });
        }
      } else {
        timer = setTimeout(() => goToSlide(1), 3000);
      }
    </script>
  </body>
</html>
