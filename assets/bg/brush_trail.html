<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procreate Brush Trail Background</title>
<style>
  /* ============================================================
     PROCREATE BRUSH TRAIL
     1. Replace BRUSH_SRC in the script with your exported brush
        PNG (white or black shape on TRANSPARENT background).
     2. Replace the image URL in .bg with your background image.
     3. Content goes inside <main class="content">.
     ============================================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  .bg {
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600&q=60'); /* <-- YOUR IMAGE */
    background-size: cover;
    background-position: center;
    z-index: -2;
  }

  #brush {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  .content {
    position: relative;
    min-height: 100%;
    display: grid;
    place-items: center;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  .content h1 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 300; letter-spacing: 0.3em; }
  .content p  { opacity: 0.7; margin-top: 1rem; }
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="brush"></canvas>

<main class="content">
  <h1>MOVE YOUR MOUSE</h1>
  <p>Demo content — replace with your site.</p>
</main>

<script>
(function () {
  'use strict';

  // ---------------- CONFIG ----------------
  var BRUSH_SRC   = 'brush-stamp.png'; // <-- YOUR exported Procreate stamp PNG
  var COLOR       = '#F4D03F';         // track color
  var SIZE        = 140;   // stamp size in px (like brush size in Procreate)
  var SIZE_JITTER = 0.35;  // 0 = uniform, 1 = wildly varied sizes
  var SPACING     = 0.25;  // gap between stamps as fraction of SIZE
                           // (Procreate's "spacing" — lower = smoother track)
  var ROTATE      = true;  // random rotation per stamp (like brush "jitter")
  var FOLLOW_PATH = true;  // also align stamps to stroke direction
  var LIFETIME    = 2.5;   // seconds before a stamp fully fades
  var MAX_STAMPS  = 400;   // hard cap; oldest are dropped (perf safety)
  var OPACITY     = 0.9;   // peak opacity of a fresh stamp
  // -----------------------------------------

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var canvas = document.getElementById('brush');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5); // cap DPR for perf

  function resize() {
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  resize();
  var rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(resize, 150); });

  // ---- Load the brush PNG and tint it #F4D03F once, up front ----
  var stamp = null;
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    var x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    // keep the brush's alpha/texture, replace its color with COLOR
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = COLOR;
    x.fillRect(0, 0, c.width, c.height);
    stamp = c;
  };
  img.onerror = function () {
    console.warn('Brush image "' + BRUSH_SRC + '" not found. ' +
      'Export your Procreate brush as a transparent PNG and update BRUSH_SRC.');
  };
  img.src = BRUSH_SRC;

  // ---- Stamp trail state ----
  var stamps = [];            // {x, y, size, rot, born}
  var lastX = null, lastY = null, carry = 0;
  var running = false;

  function addStamp(x, y, angle) {
    var jitter = 1 + (Math.random() * 2 - 1) * SIZE_JITTER;
    stamps.push({
      x: x * dpr,
      y: y * dpr,
      size: SIZE * jitter * dpr,
      rot: (FOLLOW_PATH ? angle : 0) + (ROTATE ? Math.random() * Math.PI * 2 : 0),
      born: performance.now()
    });
    if (stamps.length > MAX_STAMPS) stamps.splice(0, stamps.length - MAX_STAMPS);
  }

  window.addEventListener('pointermove', function (e) {
    var x = e.clientX, y = e.clientY;
    if (lastX !== null) {
      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var angle = Math.atan2(dy, dx);
      var step = Math.max(4, SIZE * SPACING);
      // "carry" keeps spacing perfectly even across events -> continuous track
      var travelled = carry;
      while (travelled + step <= dist) {
        travelled += step;
        var t = travelled / dist;
        addStamp(lastX + dx * t, lastY + dy * t, angle);
      }
      carry = dist - travelled;
    } else {
      addStamp(x, y, 0);
    }
    lastX = x; lastY = y;
    if (!running) { running = true; requestAnimationFrame(frame); }
  }, { passive: true });

  document.addEventListener('pointerleave', function () { lastX = lastY = null; carry = 0; });

  function frame(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (stamp) {
      var life = LIFETIME * 1000;
      var alive = 0;
      for (var i = 0; i < stamps.length; i++) {
        var s = stamps[i];
        var age = (now - s.born) / life;
        if (age >= 1) continue;
        alive++;
        // ease-out fade
        ctx.globalAlpha = OPACITY * (1 - age) * (1 - age);
        ctx.setTransform(1, 0, 0, 1, s.x, s.y);
        ctx.rotate(s.rot);
        ctx.drawImage(stamp, -s.size / 2, -s.size / 2, s.size, s.size);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;

      // drop fully-faded stamps from the front of the list
      while (stamps.length && (now - stamps[0].born) >= life) stamps.shift();

      // auto-sleep when nothing is visible (0% CPU while idle)
      if (alive === 0 && stamps.length === 0) {
        running = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
