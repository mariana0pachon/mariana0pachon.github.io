<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>light drops</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="project">
    <div class="page-loader" id="pageLoader"><div class="page-loader-dot"></div></div>
    <div class="project-image"></div>

    <div class="project-content">
      <a class="project-back" href="../index.html">← back</a>
      <h1>light drops</h1>
      <p>
        An experimentation with piezoelectric energy harvesting to translate
        rain drops to light.
      </p>
      <p>
        The lights under the umbrella are powered only by the voltage generated
        by the impact of the rain drops on the piezoelectric sensor.
      </p>
    </div>
    <script>
      const loader = document.getElementById('pageLoader');
      let hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      }
      document.addEventListener('DOMContentLoaded', hideLoader);
      setTimeout(hideLoader, 3000);
    </script>
  </body>
</html>
