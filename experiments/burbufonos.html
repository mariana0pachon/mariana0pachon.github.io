<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="../styles.css" />

  <body class="project">
    <div class="page-loader" id="pageLoader">
      <div class="page-loader-dot"></div>
    </div>

    <div class="project-header">
      <a class="project-back" href="../index.html">← back</a>
      <h1>burbúfonos</h1>
      <p>
        A playful installation where two people talk over the phone and receive
        only bubble signals from their friend.
      </p>
      <p>
        Built using an ESP32 board, 2 microphones, and 2 hacked bubble machines.
      </p>
    </div>

    <div class="media-grid">
      <div class="media-item">
        <video class="lazy-video" muted loop playsinline preload="none">
          <source
            data-src="../assets/experiments/burbufonos/02.MOV"
            type="video/mp4"
          />
        </video>
      </div>
      <div class="media-item">
        <video class="lazy-video" muted loop playsinline preload="none">
          <source
            data-src="../assets/experiments/burbufonos/03.MOV"
            type="video/mp4"
          />
        </video>
      </div>
      <div class="media-item">
        <img
          src="../assets/experiments/burbufonos/03.jpg"
          alt="burbúfonos"
          loading="lazy"
          decoding="async"
        />
      </div>
      <div class="media-item">
        <video class="lazy-video" muted loop playsinline preload="none">
          <source
            data-src="../assets/experiments/burbufonos/05.mov"
            type="video/mp4"
          />
        </video>
      </div>
      <div class="media-item">
        <img

      </div>
      <div class="media-item">
        <video class="lazy-video" muted loop playsinline preload="none">
          <source

            type="video/mp4"
          />
        </video>

      <div class="media-item">

      <div class="media-item">

            type="video/mp4"
          />
        </video>
      </div>
      <div class="media-item">
        <video class="lazy-video" muted loop playsinline preload="none">

          />

    <script>
      const loader = document.getElementById('pageLoader');
      document.addEventListener('DOMContentLoaded', () => {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      });
      setTimeout(() => {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      }, 4000);
    </script>
    <script>
      document.querySelectorAll('video.lazy-video').forEach((video) => {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const source = video.querySelector('source[data-src]');
              if (source) {
                source.src = source.dataset.src;
                video.load();
              }
              video.play().catch(() => {});
              io.unobserve(video);
            });
          },
          { rootMargin: '300px 0px' }
        );
        io.observe(video);
      });
    </script>
  </body>
