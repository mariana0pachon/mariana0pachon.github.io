  <body class="project">
    <div class="page-loader" id="pageLoader"><div class="page-loader-dot"></div></div>
    <div class="project-image has-slideshow" id="slideshow">
      <div class="slideshow-slide active">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/02.MOV" type="video/mp4" />
        </video>
      </div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/03.MOV" type="video/mp4" />
        </video>
      </div>
      <div
        class="slideshow-slide"
        style="background-image: url('../assets/experiments/burbufonos/03.jpg');"
      ></div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/05.mov" type="video/mp4" />
        </video>
      </div>
      <div
        class="slideshow-slide"
        style="background-image: url('../assets/experiments/burbufonos/06.jpg');"
      ></div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/07.MP4" type="video/mp4" />
        </video>
      </div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/08.MOV" type="video/mp4" />
        </video>
      </div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/09.MOV" type="video/mp4" />
        </video>
      </div>
      <div class="slideshow-slide">
        <video muted playsinline>
          <source src="../assets/experiments/burbufonos/10.MOV" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="project-content">
      <a class="project-back" href="../index.html">← back</a>
      <h1>burbúfonos</h1>
      <p>
        A playful installation where two people talk over the phone and recieve
        only bubble signals from their friend.
      </p>
      <p>
        Built using an ESP32 board, 2 microphones, and 2 hacked bubble machines.
      </p>
    </div>

    <script>
      const slides = document.querySelectorAll('.slideshow-slide');
      let current = 0;
      let timer = null;

      const loader = document.getElementById('pageLoader');
      let loaderHidden = false;
      const loaderFallback = setTimeout(() => hideLoader(), 5000);

      function hideLoader() {
        if (loaderHidden) return;
        loaderHidden = true;
        clearTimeout(loaderFallback);
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      }

      function preloadNext(idx) {
        const nextVideo = slides[(idx + 1) % slides.length].querySelector('video');
        if (nextVideo && !nextVideo.dataset.preloaded) {
          nextVideo.preload = 'auto';
          nextVideo.load();
          nextVideo.dataset.preloaded = 'true';
        }
      }

      function goToSlide(index) {
        clearTimeout(timer);

        const prevSlide = slides[current];
        const prevVideo = prevSlide.querySelector('video');
        if (prevVideo) {
          prevVideo.pause();
          prevVideo.currentTime = 0;
        }
        prevSlide.classList.remove('active');

        current = index % slides.length;
        const slide = slides[current];
        slide.classList.add('active');

        const video = slide.querySelector('video');
        if (video) {
          video.addEventListener('ended', () => goToSlide(current + 1), { once: true });
          video.addEventListener('error', () => goToSlide(current + 1), { once: true });
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              video.muted = true;
              video.play();
            });
          }
          preloadNext(current);
        } else {
          preloadNext(current);
          timer = setTimeout(() => goToSlide(current + 1), 3000);
        }
      }

      const firstVideo = slides[0].querySelector('video');
      if (firstVideo) {
        firstVideo.preload = 'auto';
        firstVideo.addEventListener('canplay', hideLoader, { once: true });
        firstVideo.addEventListener('error', hideLoader, { once: true });
        firstVideo.addEventListener('ended', () => goToSlide(1), { once: true });
        firstVideo.addEventListener('error', () => goToSlide(1), { once: true });
        firstVideo.load();
        const playPromise = firstVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            firstVideo.muted = true;
            firstVideo.play();
          });
        }
        preloadNext(0);
      } else {
        hideLoader();
        timer = setTimeout(() => goToSlide(1), 3000);
      }
    </script>
  </body>
</html>
