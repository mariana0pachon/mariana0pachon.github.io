<!doctype html>
<html lang="en">
  <head>

  <body class="project">
    <div class="page-loader" id="pageLoader"><div class="page-loader-dot"></div></div>

    <div class="project-header">
      <a class="project-back" href="../index.html">← back</a>
      <h1>shrinking theatre</h1>
      <p>A prototype of a theatre that shrinks while the main character of the play gets overwhelmed with their thoughts.</p>
      <p>Built using 2 rack and pinion mechanisms, each with a continuous rotation Servo motor.</p>
    </div>

    <div class="media-two-col">
      <div class="media-col">
        <div class="media-item">
          <video muted autoplay loop playsinline>

        </div>
        <div class="media-item">
          <video muted autoplay loop playsinline>
            <source src="../assets/experiments/shrinking_theatre/02.MOV" type="video/mp4" />

          </video>
        </div>

    <script>
      const loader = document.getElementById('pageLoader');
      window.addEventListener('load', () => {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      });
      setTimeout(() => { loader.classList.add('fade-out'); setTimeout(() => loader.remove(), 600); }, 4000);
