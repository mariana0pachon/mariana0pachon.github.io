<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shrinking theatre</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="project">
    <div class="page-loader" id="pageLoader"><div class="page-loader-dot"></div></div>

    <div class="project-header">
      <a class="project-back" href="../index.html">← back</a>
      <h1>shrinking theatre</h1>
      <p>A prototype of a theatre that shrinks while the main character of the play gets overwhelmed with their thoughts.</p>
      <p>Built using 2 rack and pinion mechanisms, each with a continuous rotation Servo motor.</p>
    </div>

    <div class="media-two-col">
      <div class="media-col">
        <div class="media-item">
          <video class="lazy-video" muted loop playsinline preload="none">
            <source data-src="../assets/experiments/shrinking_theatre/01.mov" type="video/mp4" />
          </video>
        </div>
        <div class="media-item">
          <video class="lazy-video" muted loop playsinline preload="none">
            <source data-src="../assets/experiments/shrinking_theatre/02.MOV" type="video/mp4" />
          </video>
        </div>
        <div class="media-item">
          <video class="lazy-video" muted loop playsinline preload="none">
            <source data-src="../assets/experiments/shrinking_theatre/03.MOV" type="video/mp4" />
          </video>
        </div>
      </div>
      <div class="media-col">
        <div class="media-item">
          <video class="lazy-video" muted loop playsinline preload="none">
            <source data-src="../assets/experiments/shrinking_theatre/04.mov" type="video/mp4" />
          </video>
        </div>
        <div class="media-item">
          <video class="lazy-video" muted loop playsinline preload="none">
            <source data-src="../assets/experiments/shrinking_theatre/05.MOV" type="video/mp4" />
          </video>
        </div>
      </div>
    </div>

    <script>
      const loader = document.getElementById('pageLoader');
      document.addEventListener('DOMContentLoaded', () => {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      });
      setTimeout(() => { loader.classList.add('fade-out'); setTimeout(() => loader.remove(), 600); }, 4000);
    </script>
    <script>
      document.querySelectorAll('video.lazy-video').forEach((video) => {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              const source = video.querySelector('source[data-src]');
              if (source) {
                source.src = source.dataset.src;
                video.load();
              }
              video.play().catch(() => {});
              io.unobserve(video);
            });
          },
          { rootMargin: '300px 0px' }
        );
        io.observe(video);
      });
    </script>
  </body>
</html>
